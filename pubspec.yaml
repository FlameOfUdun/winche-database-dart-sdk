name: winche_database
description: Type-safe Dart client for Winche Database — an offline-first, real-time document store over a single WebSocket connection.
version: 5.0.0
repository: https://github.com/FlameOfUdun/winche-database-dart-sdk
issue_tracker: https://github.com/FlameOfUdun/winche-database-dart-sdk/issues

topics:
  - database
  - realtime
  - websocket
  - offline
  - nosql

environment:
  # Raised from ^3.5.0: winche_core requires ^3.10.0, and a path dependency
  # is not version-solved, so without this the package would claim support for
  # SDKs it cannot build on.
  sdk: ^3.10.0

dependencies:
  # Path dependency until winche_core is published. Suppressed rather than
  # setting `publish_to: none`, which would misstate the intent -- this package
  # is still meant for pub.dev, it just cannot be published until core is.
  winche_core:
    path: ../winche_core
  web_socket_channel: ^3.0.0
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  meta: ^1.15.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  stream_channel: ^2.1.0
